<style>
:root{--canvas:#d9d8d2;--paper:#ebeae4;--ink:#1b1c1e;--cobalt:#1f4fd8;--muted:#52534d;--stone:#c6c5be;--warn:#8a2b12;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--body:'Onest',system-ui,'Segoe UI',sans-serif;--mono:'Martian Mono',ui-monospace,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 16px/1.5 var(--body);overflow-x:hidden}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
[hidden]{display:none!important}
.mono{font:400 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.shell{width:min(560px,100%);margin-inline:auto;padding:0 14px calc(96px + var(--safe-b))}

.head{position:sticky;top:0;z-index:5;background:var(--canvas);display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px;margin:0 -14px;padding:0 14px}
.mark{font:900 27px/1 var(--display);letter-spacing:.04em}
.mark b{color:var(--cobalt)}
.mark span{font:400 10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);margin-left:8px;vertical-align:middle}
.cart-btn{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;background:var(--ink);color:var(--paper);border-radius:2px;font:700 14px/1 var(--body)}
.cart-btn i{font:600 12px/1 var(--mono);font-style:normal;background:var(--cobalt);color:#fff;min-width:22px;padding:5px 6px;text-align:center;border-radius:2px}

.head-r{display:flex;align-items:center;gap:8px}
.langs{display:flex;border:1.5px solid var(--ink);border-radius:2px}
.langs button{min-width:34px;min-height:37px;font:600 11px/1 var(--mono);letter-spacing:.04em}
.langs button+button{border-left:1.5px solid var(--ink)}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
@media(max-width:420px){.mark span{display:none}.cart-btn{padding:0 10px}}

.note{background:var(--paper);border-top:4px solid var(--ink);padding:12px 14px;margin:6px 0 14px;font-size:14.5px}
.note a{font-weight:700;color:var(--cobalt)}

.chips{display:flex;gap:8px;overflow-x:auto;margin:4px -14px 14px;padding:2px 14px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 13px;border:1.5px solid var(--ink);border-radius:2px;font:500 14px/1 var(--body);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.card{display:block;width:100%;text-align:left;background:var(--paper)}
.ph{position:relative;aspect-ratio:4/5;background:var(--stone);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.flag{position:absolute;left:0;font:600 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px}
.flag-demo{bottom:0;background:var(--ink);color:var(--paper)}
.flag-new{top:0;background:var(--cobalt);color:#fff}
.card.out .ph img{filter:grayscale(1);opacity:.55}
.cb{padding:10px 10px 12px}
.cb h3{font:700 15px/1.25 var(--body);min-height:2.5em}
.price{margin-top:6px;font:700 22px/1 var(--display);letter-spacing:.02em}
.price small{font:400 11px/1 var(--mono);color:var(--muted);margin-left:3px}
.stock-out{margin-top:6px;color:var(--warn);font:600 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.empty{grid-column:1/-1;padding:28px 0;color:var(--muted);text-align:center}
.foot{margin-top:26px;color:var(--muted);font-size:13px;line-height:1.5}

dialog{border:0;padding:0;margin:auto auto 0;width:min(560px,100%);max-width:100%;max-height:92dvh;background:var(--paper);color:var(--ink);overflow:auto;overscroll-behavior:contain;border-top:5px solid var(--ink)}
dialog::backdrop{background:rgba(27,28,30,.62)}
.sheet-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;background:var(--paper);padding:10px 14px}
.x{min-width:40px;min-height:40px;font:700 14px/1 var(--body);text-decoration:underline;text-underline-offset:4px}
.sheet{padding:0 14px calc(18px + var(--safe-b))}
.p-top{display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:start}
.p-top .ph{aspect-ratio:4/5}
.p-top h2{font:900 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.p-top .price{font-size:26px;margin-top:10px}
.p-desc{margin-top:12px;font-size:14.5px}
.p-mat{margin-top:8px;color:var(--muted)}
.opt{margin-top:16px}
.opt h3{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.o{min-width:46px;min-height:42px;padding:0 12px;border:1.5px solid var(--ink);border-radius:2px;font:500 14px/1 var(--body)}
.o[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:2px}
.qty button{width:44px;height:42px;font:700 20px/1 var(--body)}
.qty button:disabled{opacity:.3}
.qty output{min-width:38px;text-align:center;font:600 15px/1 var(--mono)}
.left{margin-left:12px;color:var(--muted);font-size:13px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;margin-top:18px;background:var(--cobalt);color:#fff;border-radius:2px;font:700 16px/1.2 var(--body);text-decoration:none;text-align:center;padding:8px 14px}
.go:disabled{background:var(--stone);color:var(--muted)}
.hint{margin-top:8px;color:var(--muted);font-size:13px;text-align:center}

.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--stone)}
.line .ph{aspect-ratio:4/5}
.line h3{font:700 15px/1.25 var(--body)}
.line p{color:var(--muted);font-size:13px;margin-top:2px}
.line .sum{font:700 19px/1 var(--display);margin-top:6px}
.line .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.line .qty button{width:36px;height:36px;font-size:18px}
.line .qty output{min-width:28px}
.rm{font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--muted);min-height:28px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.total b{font:900 32px/1 var(--display);letter-spacing:.02em}
.sheet h2.t{font:900 30px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 14px calc(10px + var(--safe-b));background:var(--canvas);border-top:1px solid var(--stone)}
.bar .go{margin:0 auto;width:min(532px,100%);justify-content:space-between}
.bar .go span:last-child{font:700 20px/1 var(--display);letter-spacing:.03em}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px)}}}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="mark">ASCORE<b>.</b><span data-t="sub"></span></div>
    <div class="head-r">
      <div class="langs" id="langs" role="group" aria-label="Til / Язык / Language">
        <button type="button" data-lang="uz" lang="uz">UZ</button><button type="button" data-lang="ru" lang="ru">RU</button><button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <button class="cart-btn" id="cartBtn" type="button" data-t-aria="cartOpen"><span data-t="cart"></span> <i id="cartCount">0</i></button>
    </div>
  </header>

  <p class="note" id="note" hidden></p>

  <nav class="chips" id="chips" data-t-aria="cats"></nav>
  <main class="grid" id="grid" aria-live="polite"><p class="empty" data-t="loading"></p></main>

  <p class="foot"><span data-t="foot"></span> <a href="../credits.html" data-t="credits"></a></p>
</div>

<div class="bar" id="bar" hidden>
  <button class="go" id="barBtn" type="button"><span id="barText"></span><span id="barSum"></span></button>
</div>

<dialog id="pd" aria-labelledby="pdName">
  <div class="sheet-top"><span class="mono" id="pdCat"></span><button class="x" type="button" data-close data-t="close"></button></div>
  <div class="sheet">
    <div class="p-top">
      <div class="ph" id="pdPh"></div>
      <div>
        <h2 id="pdName"></h2>
        <p class="price" id="pdPrice"></p>
        <p class="p-mat mono" id="pdMat"></p>
      </div>
    </div>
    <p class="p-desc" id="pdDesc"></p>
    <div class="opt"><h3 data-t="size"></h3><div class="opts" id="pdSizes"></div></div>
    <div class="opt"><h3 data-t="color"></h3><div class="opts" id="pdColors"></div></div>
    <div class="opt"><h3 data-t="qty"></h3>
      <span class="qty"><button type="button" id="qMinus" data-t-aria="less">&minus;</button><output id="qVal">1</output><button type="button" id="qPlus" data-t-aria="more">+</button></span>
      <span class="left" id="pdLeft"></span>
    </div>
    <button class="go" id="pdAdd" type="button"></button>
  </div>
</dialog>

<dialog id="cd" aria-labelledby="cdTitle">
  <div class="sheet-top"><span class="mono">ASCORE / <span data-t="cart"></span></span><button class="x" type="button" data-close data-t="close"></button></div>
  <div class="sheet">
    <h2 class="t" id="cdTitle" data-t="cart"></h2>
    <div id="cdLines"></div>
    <div class="total" id="cdTotalRow"><span class="mono" data-t="total"></span><b id="cdTotal"></b></div>
    <button class="go" id="cdSend" type="button" data-t="send"></button>
    <a class="go" id="cdOpenBot" href="https://t.me/ASCOREclothbot" target="_blank" rel="noopener" hidden data-t="openBot"></a>
    <p class="hint" id="cdHint"></p>
  </div>
</dialog>

      credits: 'Источники фото'
    },
    en: {
      title: 'ASCORE | Mini app', sub: 'MINI APP', cart: 'Cart', cartOpen: 'Open cart', cats: 'Categories',
      loading: 'Loading the catalog…', all: 'All', emptyCat: 'Nothing in this section yet.',

  };
  var LANGS = ['uz', 'ru', 'en'];

  function pickLang(raw) {
    raw = String(raw || '').toLowerCase().slice(0, 2);
    return LANGS.indexOf(raw) > -1 ? raw : null;
  }
  var urlLang = null, tgLang = null;
  try { urlLang = pickLang(new URLSearchParams(location.search).get('lang')); } catch (e) {}
  try { tgLang = tg.initDataUnsafe.user.language_code; } catch (e) {}
  // The bot passes the customer's bot language in the link. A choice made here is kept until

  function stored() {
    try { var s = JSON.parse(localStorage.getItem(LANG_KEY) || 'null'); return s && pickLang(s.l) && s.u === urlLang ? s.l : null; }
    catch (e) { return null; }
  }
  var lang = stored() || urlLang || pickLang(tgLang) || pickLang(navigator.language) || 'uz';

  function T(key, vars) {

    if (text != null) n.textContent = text;

  var money = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); };

    try {

  function haptic(kind) { try { if (inTg) tg.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {} }

    applyStatic();
    if (failed) { showLoadError(); return; }
    if (!loaded) return;
    renderChips();
    renderGrid();
    renderBar();
    if ($('pd').open && cur) fillProduct();
    if ($('cd').open) renderCart();
  }

  function setLang(next) {
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem(LANG_KEY, JSON.stringify({ l: lang, u: urlLang })); } catch (e) {}
    haptic();
    renderAll();
  }

  function renderChips() {
    var box = $('chips');
    box.textContent = '';
    [{ slug: 'all' }].concat(cats).forEach(function (c) {
      var b = el('button', 'chip', c.slug === 'all' ? T('all') : catName(c.slug));
      b.type = 'button';
      b.setAttribute('aria-pressed', String(filter === c.slug));
      b.addEventListener('click', function () { filter = c.slug; renderChips(); renderGrid(); });
      box.appendChild(b);
    });
  }

  function renderGrid() {
    var grid = $('grid');
    grid.textContent = '';
    var list = products.filter(function (p) { return filter === 'all' || p.cat === filter; });
    if (!list.length) { grid.appendChild(el('p', 'empty', T('emptyCat'))); return; }
    list.forEach(function (p) {
      var card = el('button', 'card' + (p.stock < 1 ? ' out' : ''));
      card.type = 'button';
      var ph = el('div', 'ph');
      photo(p, ph);
      if (p.demo) ph.appendChild(el('span', 'flag flag-demo', T('demo')));
      if (p.new) ph.appendChild(el('span', 'flag flag-new', T('isNew')));
      var cb = el('div', 'cb');
      cb.appendChild(el('h3', '', p.name));
      cb.appendChild(priceNode('price', p.price));
      if (p.stock < 1) cb.appendChild(el('p', 'stock-out', T('out')));
      card.appendChild(ph);
      card.appendChild(cb);
      card.addEventListener('click', function () { openProduct(p); });
      grid.appendChild(card);
    });
  }

  function options(box, values, picked, onPick) {
    box.textContent = '';
    values.forEach(function (v) {
      var b = el('button', 'o', v);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(v === picked));
      b.addEventListener('click', function () { onPick(v); });
      box.appendChild(b);
    });
  }

  function openProduct(p) {
    cur = { p: p, s: p.sizes.length === 1 ? p.sizes[0] : null, c: p.colors.length === 1 ? p.colors[0] : null, q: 1 };
    photo(p, $('pdPh'));
    fillProduct();
    show($('pd'));
  }

  function fillProduct() {
    var p = cur.p;
    $('pdCat').textContent = 'ASCORE / ' + catName(p.cat);
    $('pdName').textContent = p.name;
    var pr = $('pdPrice');
    pr.textContent = money(p.price);
    pr.appendChild(el('small', '', T('cur')));
    $('pdMat').textContent = p.mat;
    $('pdDesc').textContent = p.desc;
    renderProduct();
  }

  function renderProduct() {
    var p = cur.p;
    var free = Math.max(0, Math.min(p.stock - inCart(p.id), MAX_QTY));
    if (cur.q > free) cur.q = Math.max(1, free);
    options($('pdSizes'), p.sizes, cur.s, function (v) { cur.s = v; renderProduct(); });
    options($('pdColors'), p.colors, cur.c, function (v) { cur.c = v; renderProduct(); });
    $('qVal').textContent = cur.q;
    $('qMinus').disabled = cur.q <= 1;
    $('qPlus').disabled = cur.q >= free;
    $('pdLeft').textContent = free > 0 && free <= 5 ? T('left', { n: free }) : '';
    var add = $('pdAdd');
    if (free < 1) {
      add.disabled = true;
      add.textContent = p.stock < 1 ? T('out') : T('allIn');
    } else if (!cur.s || !cur.c) {
      add.disabled = true;
      add.textContent = !cur.s ? T('pickSize') : T('pickColor');
    } else {
      add.disabled = false;
      add.textContent = T('add', { sum: sum(p.price * cur.q) });
    }
  }

  function addToCart() {
    var p = cur.p;
    var line = cart.filter(function (l) { return l.id === p.id && l.s === cur.s && l.c === cur.c; })[0];
    if (line) line.q += cur.q;
    else {
      if (cart.length >= MAX_LINES) { alert(T('maxLines', { n: MAX_LINES })); return; }
      cart.push({ id: p.id, s: cur.s, c: cur.c, q: cur.q });
    }
    saveCart();
    haptic('medium');
    $('pd').close();
    renderBar();
  }

  function renderBar() {
    var n = cartCount();
    $('cartCount').textContent = n;
    $('bar').hidden = n < 1;
    $('barText').textContent = T('bar', { n: n });
    $('barSum').textContent = sum(cartTotal());
  }

  function renderCart() {
    var box = $('cdLines');
    box.textContent = '';
    var empty = cart.length < 1;
    $('cdTotalRow').hidden = empty;
    $('cdSend').hidden = empty || !canSend;
    $('cdOpenBot').hidden = empty || canSend;
    $('cdHint').textContent = empty ? '' : T(canSend ? 'hintSend' : (inTg ? 'hintTg' : 'hintWeb'));
    if (empty) { box.appendChild(el('p', 'empty', T('emptyCart'))); return; }
    cart.forEach(function (l) {
      var p = byId[l.id];
      var row = el('div', 'line');
      var ph = el('div', 'ph');
      photo(p, ph);
      var mid = el('div');
      mid.appendChild(el('h3', '', p.name));
      mid.appendChild(el('p', '', l.s + ' · ' + l.c));
      mid.appendChild(el('p', 'sum', sum(p.price * l.q)));
      var side = el('div', 'side');
      var qty = el('span', 'qty');
      var minus = el('button', '', '−'), out = el('output', '', l.q), plus = el('button', '', '+');
      minus.type = plus.type = 'button';
      minus.setAttribute('aria-label', T('less') + ': ' + p.name);
      plus.setAttribute('aria-label', T('more') + ': ' + p.name);
      plus.disabled = l.q >= Math.min(MAX_QTY, p.stock - inCart(p.id, l));
      minus.addEventListener('click', function () { change(l, -1); });
      plus.addEventListener('click', function () { change(l, 1); });
      qty.appendChild(minus); qty.appendChild(out); qty.appendChild(plus);
      var rm = el('button', 'rm', T('remove'));
      rm.type = 'button';
      rm.setAttribute('aria-label', T('remove') + ': ' + p.name);
      rm.addEventListener('click', function () { change(l, -l.q); });
      side.appendChild(qty); side.appendChild(rm);
      row.appendChild(ph); row.appendChild(mid); row.appendChild(side);
      box.appendChild(row);
    });
    $('cdTotal').textContent = sum(cartTotal());
  }

  function change(line, delta) {
    line.q += delta;
    if (line.q < 1) cart.splice(cart.indexOf(line), 1);
    saveCart();
    haptic();
    renderCart();
    renderBar();
  }

  function send() {
    var payload = JSON.stringify({ v: 1, lang: lang, items: cart.map(function (l) { return { id: l.id, s: l.s, c: l.c, q: l.q }; }) });
    if (new TextEncoder().encode(payload).length > MAX_BYTES) { alert(T('tooBig')); return; }
    cart = [];
    saveCart();
    tg.sendData(payload); // Telegram closes the mini app and delivers the cart to the bot
  }

  function show(d) {
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    try { if (inTg) tg.BackButton.show(); } catch (e) {}
  }
  function closeAll() { ['pd', 'cd'].forEach(function (id) { var d = $(id); if (d.open) d.close(); }); }
  function showLoadError() {
    var grid = $('grid');
    grid.textContent = '';
    grid.appendChild(el('p', 'empty', T('loadErr')));
  }

  ['pd', 'cd'].forEach(function (id) {
    var d = $(id);
    d.addEventListener('click', function (ev) { if (ev.target === d || ev.target.hasAttribute('data-close')) d.close(); });
    d.addEventListener('close', function () { try { if (inTg) tg.BackButton.hide(); } catch (e) {} renderBar(); });
  });
  document.querySelectorAll('#langs button').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
  });
  $('qMinus').addEventListener('click', function () { cur.q--; renderProduct(); });
  $('qPlus').addEventListener('click', function () { cur.q++; renderProduct(); });
  $('pdAdd').addEventListener('click', addToCart);
  $('cdSend').addEventListener('click', send);
  function openCart() { renderCart(); show($('cd')); }
  $('cartBtn').addEventListener('click', openCart);
  $('barBtn').addEventListener('click', openCart);

  if (inTg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#d9d8d2');
      tg.setBackgroundColor('#d9d8d2');
      tg.BackButton.onClick(closeAll);
    } catch (e) {}
  }
  applyStatic();

  fetch('products.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      products = data.products || [];
      cats = data.cats || [];
      products.forEach(function (p) { byId[p.id] = p; });
      // Drop saved lines that no longer match the catalog.
      cart = cart.filter(function (l) {
        var p = byId[l.id];
        return p && p.stock > 0 && p.sizes.indexOf(l.s) > -1 && p.colors.indexOf(l.c) > -1;
      });
      cart.forEach(function (l) { l.q = Math.max(1, Math.min(l.q, byId[l.id].stock, MAX_QTY)); });
      saveCart();
      loaded = true;
      renderAll();
    })
    .catch(function () { failed = true; showLoadError(); });
})();
</script>
</body>
</html>
